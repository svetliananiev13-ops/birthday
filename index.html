
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Честит рожден ден!</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff6a88, #ff99ac);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
h1 { font-size: 48px; }
p { font-size: 24px; }
button {
  margin-top: 30px;
  padding: 15px 35px;
  font-size: 20px;
  border-radius: 30px;
  border: none;

}

<body>

<p>Да си жива и здрава и много щастлив! ❤️</p>

<button onclick="playMusic()">▶ Пусни песента</button>

<script>
function playMusic() {
  document.getElementById("music").src =

}
</script>

</html>
